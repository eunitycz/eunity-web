en:
  hero_title: Explore the world
  hero_title_italic: through learning
  hero_text: We help young people grow. We send young people to international Erasmus+ exchanges and organise our own projects on wellbeing, health and life online.
  blocks:
    - title: Erasmus+ isn’t just for university students
      text: You can join a youth exchange while still at secondary school, while working, or while figuring out what’s next. Erasmus+ covers travel, accommodation and food – you bring home experience, friends from all over Europe and a Youthpass certificate.
      link_label: How it works
      link: faq
      image: ""
    - title: We run our own projects in Czechia
      text: We invite young people from all over Europe to exchanges about mental and physical health, sustainability and our relationship with social media. What we create there, we share in booklets and worksheets.
      link_label: Our projects
      link: our
      image: ""
