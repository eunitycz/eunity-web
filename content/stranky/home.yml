  hero_title_italic: through learning
  hero_text: Pomáháme mladým lidem růst. Vysíláme mladé lidi na mezinárodní výměny Erasmus+ a pořádáme vlastní projekty o wellbeingu, zdraví a životě online.
  hero_image: ""
  blocks:
    - title: Erasmus+ není jen pro vysokoškoláky
      text: Na výměnu mládeže můžeš vyjet, i když jsi na střední, pracuješ, nebo zrovna nevíš, co dál. Cestovné, ubytování i jídlo hradí program Erasmus+, ty si přivezeš zkušenosti, kamarády z celé Evropy a certifikát Youthpass.
      link_label: Jak to funguje
      link: faq
      image: ""
    - title: Pořádáme vlastní projekty v Česku
      text: Zveme mladé lidi z celé Evropy na výměny o duševním a fyzickém zdraví, udržitelnosti a vztahu k sociálním sítím. Co na nich vznikne, sdílíme dál v bookletech a pracovních listech.
