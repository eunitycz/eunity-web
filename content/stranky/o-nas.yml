cs:
  title: O nás
  image: ""
  body: |
    Organizace EUnity vznikla v zimě roku 2023 z iniciativy dvou mladých holek, které se potkaly na Erasmu v Rumunsku. Pro obě z nás byl svět Erasmu něco výjimečného – možnost poznávat Evropu, navazovat mezinárodní přátelství a přitom se vzdělávat. Win-win. Z toho nadšení a zkušeností z výměn mládeže a tréninkových kurzů vznikla myšlenka založit vlastní organizaci, která pomůže mladým lidem chopit se podobných příležitostí a rozvíjet se prostřednictvím neformálního vzdělávání.

    Naším cílem je propojovat mladé lidi s projekty programu Erasmus+, zprostředkovávat jim informace o možnostech zapojení a aktivně je vysílat na zahraniční výměny mládeže a tréninkové kurzy. Zároveň sami organizujeme vlastní projekty a akce, které reagují na aktuální společenská témata a podporují osobní rozvoj, spolupráci a kreativitu.

    EUnity se zaměřuje především na duševní zdraví, zdravé užívání sociálních sítí, ochranu životního prostředí a podporu aktivního životního stylu. Věříme, že v dnešní rychlé a stresující době je klíčové pečovat nejen o tělo, ale i o mysl. Našimi projekty se proto snažíme zvyšovat povědomí o těchto tématech a poskytovat mladým lidem praktické nástroje, jak pečovat o sebe i o své okolí.

    EUnity je komunitou, která propojuje, inspiruje a motivuje. Chceme, aby se mladí lidé stali aktivními občany, kteří se nebojí tvořit pozitivní změnu ve světě kolem sebe.
en:
  title: About us
  body: |
    EUnity was founded in the winter of 2023 on the initiative of two young women who met on an Erasmus project in Romania. For both of us, the world of Erasmus was something special – a chance to get to know Europe, make international friendships and learn at the same time. Win-win. That enthusiasm and our experience from youth exchanges and training courses gave rise to the idea of founding our own organisation to help young people seize similar opportunities and grow through non-formal education.

    Our aim is to connect young people with Erasmus+ projects, share information about ways to get involved and actively send them to youth exchanges and training courses abroad. At the same time, we organise our own projects and events that respond to current social issues and support personal development, cooperation and creativity.

    EUnity focuses mainly on mental health, healthy use of social media, environmental protection and an active lifestyle. We believe that in today’s fast and stressful times it is essential to take care not only of the body but also of the mind. Through our projects we raise awareness of these topics and give young people practical tools to take care of themselves and the world around them.

    EUnity is a community that connects, inspires and motivates. We want young people to become active citizens who are not afraid to create positive change in the world around them.
