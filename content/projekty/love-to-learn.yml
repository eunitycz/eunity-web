cs:
  title: Love to Learn
  type: vyslani
  format: trenink
  start: 2024-07-19
  end: 2024-07-29
  place: Drunen
  country: NL
  participants: 2
  perex: Tréninkový kurz pro youth workery o metodách neformálního vzdělávání. Vznikla na něm spolupráce na našem dalším projektu.
  report: |
    V malém městečku Drunen v Nizozemsku jsme měli příležitost zúčastnit se skvělého projektu Erasmus+ s názvem „Love to Learn“, který se konal od 19. do 29. července 2024. Cílem projektu bylo přiblížit metody neformálního vzdělávání pracovníkům s mládeží a povzbudit je k vytváření a zavádění nových přístupů do každodenní práce s mladými lidmi.

    Náš český tým složený ze dvou účastníků se připojil k dalším 28 pracovníkům s mládeží z různých evropských zemí. Společně jsme se ponořili do intenzivního programu, který zahrnoval sdílení zkušeností, interaktivní workshopy a praktické ukázky metod neformálního vzdělávání. Jedním z klíčových momentů bylo vytváření vlastních vzdělávacích aktivit. Ty jsme pak vyzkoušeli s ostatními účastníky a získali cennou zpětnou vazbu pro jejich další zlepšení.

    Během projektu jsme také navázali spolupráci s několika neziskovými organizacemi z různých koutů Evropy. Společně plánujeme realizovat projekt Erasmus+ zaměřený na duševní zdraví.

    Po návratu z Nizozemska jsme uspořádali workshop pro naše kolegy, kde jsme jim představili nové metody a aktivity, které jsme se na projektu naučili. Účast na projektu „Love to Learn“ byla pro náš tým obohacující zkušeností, která nám dala nové nástroje a inspiraci pro práci s mladými lidmi.
en:
  title: Love to Learn
  place: Drunen
  perex: A training course for youth workers on non-formal education methods – and the start of a partnership for our next project.
  report: |
    In the small town of Drunen in the Netherlands, we had the opportunity to take part in an amazing Erasmus+ project called “Love to Learn”, which took place from July 19 to July 29, 2024. The goal of this project was to popularise non-formal education methods among youth workers and encourage them to develop and implement new approaches in their daily work with young people.

    Our Czech team, consisting of two participants, joined 28 other youth workers from various European countries. Together, we immersed ourselves in an intensive program that included experience sharing, interactive workshops, and practical demonstrations of non-formal education methods. One of the key moments was the creation of our own non-formal educational activities. We then tested these activities with other participants and received valuable feedback for further improvement.

    During the project, we also established collaborations with several non-profit organisations from different parts of Europe. Together, we are planning to implement an Erasmus+ project focused on mental health.

    After returning from the Netherlands, we organised a workshop for our colleagues, where we introduced them to the new methods and activities we had learned during the project. Participating in “Love to Learn” was an enriching experience for our team, providing us with new tools and inspiration for our work with young people.
