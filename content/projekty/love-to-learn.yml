  perex: Tréninkový kurz pro youth workery o metodách neformálního vzdělávání. Vznikla na něm spolupráce na našem dalším projektu.
  report: |
    In the small town of Drunen in the Netherlands, we had the opportunity to take part in an amazing Erasmus+ project called “Love to Learn”, which took place from July 19 to July 29, 2024. The goal of this project was to popularise non-formal education methods among youth workers and encourage them to develop and implement new approaches in their daily work with young people.

    Our Czech team, consisting of two participants, joined 28 other youth workers from various European countries. Together, we immersed ourselves in an intensive program that included experience sharing, interactive workshops, and practical demonstrations of non-formal education methods. One of the key moments was the creation of our own non-formal educational activities. We then tested these activities with other participants and received valuable feedback for further improvement.

    During the project, we also established collaborations with several non-profit organisations from different parts of Europe. Together, we are planning to implement an Erasmus+ project focused on mental health.

    After returning from the Netherlands, we organised a workshop for our colleagues, where we introduced them to the new methods and activities we had learned during the project. Participating in “Love to Learn” was an enriching experience for our team, providing us with new tools and inspiration for our work with young people.
