  start: 2026-04-14
  end: 2026-04-20
  place: Fuente de Piedra
  country: ES
  perex: Tréninkový kurz pro youth workery o duševním zdraví mladých lidí – jóga, dechová cvičení, arteterapie i terapie smíchem.
  report: |
    Project Mens Sana took place from April 14th to April 20th in the small Andalusian town of Fuente de Piedra in Spain, a place mainly known for its flamingo lagoons. The main topic of the project was mental health, and it was designed especially for youth workers who wanted to develop their competences in this area while working with young people. Most of the participants arrived on the evening of April 14th, and the official programme started the following morning.

    Our group included participants from Turkey, Croatia, Serbia, Italy, Bosnia and Herzegovina, Hungary, France, Spain, and the Czech Republic. The programme was highly interactive and encouraged us to share our own experiences openly. I believe this was one of the strongest parts of the whole project, because many participants already had years of experience working with young people and were willing to share their knowledge with others. Thanks to this, we were constantly learning from one another.

    Alongside discussions and reflection activities, we also participated in many workshops focused on practical tools for improving young people’s mental health. We tried yoga, breathing techniques for stressful situations, art therapy, and even laughter therapy. Some activities also took place in the beautiful Andalusian nature and nearby forests, which felt incredibly freeing and reminded us how important contact with nature is for our psychological wellbeing.

    The organisers from the association Entrejuegos were supportive and kind throughout the entire project. In the beautiful accommodation Casa Rural Aire, they created an environment where we truly felt at home. Every day we experienced traditional Spanish culture through local food, long sunny days, and evenings full of conversations, laughter, and connection. All of this filled us with energy and gratitude for being part of something so meaningful.

    I am taking so much away from the Mens Sana project, and even after returning home, I still carry a warm feeling in my heart when thinking about it. It is rare to meet so many kind, inspiring, and open-minded people in one place. I sincerely hope I will hear from many of them again someday, because I truly believe they will do great things in the future. Before the project, I often felt like I was missing inspiration in my life — and in Spain, I found more than enough of it. The topics and questions we discussed opened my eyes in many ways and helped me grow both personally and professionally. Sometimes it almost feels unbelievable that a one-week Erasmus+ project can teach you more about yourself, people, and the world than months spent sitting in a classroom.

    I believe project Mens Sana will remain very close to my heart for a long time, because I had not felt so accepted, understood, and genuinely happy in a very long time. Now, while spending long hours studying for exams, I often find myself returning in my thoughts to those moments in Spain — laughing late into the night with people I had only known for a few days, living fully in the present moment while the warm Andalusian wind moved through our hair.

    I am deeply grateful that I had the opportunity to slow down for a while and truly experience the beauty of the present moment again. Most of all, I would like to sincerely thank EUnity and the Entrejuegos association for allowing me to be part of something so beautiful, inspiring, and unforgettable.
