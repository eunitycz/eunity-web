  perex: Tréninkový kurz o kreativních metodách v práci s mládeží – ebru, koláž, keramika a neurografie.
  report: |
    From 21 to 29 May 2026, our Project Manager, Karolína Luscoňová, participated in an international Erasmus+ training course in the Norwegian town of Balestrand. The project brought together youth workers and active individuals from various European countries who shared their experiences, inspired one another, and explored new methods of non-formal education.

    Throughout the programme, Karolína had the opportunity to experience several creative techniques that can be used in youth work. These included ebru art, collage-making, and ceramic work. The activities demonstrated how creative methods can support self-discovery, open communication, and the mental wellbeing of young people.

    A valuable part of the experience were the evening workshops facilitated by the participants themselves. Through these sessions, Karolína was introduced to techniques such as visualization and neurography, which can serve as useful tools for working with emotions, stress management, and personal goal setting.

    The project was not only focused on learning. Participants also had the opportunity to explore the history of Balestrand, discover local culture, and experience Norway’s unique natural environment. A total of 18 inspiring participants with diverse professional and personal backgrounds took part in the project, creating a space for open discussions, the exchange of good practices, and the development of new international connections.

    Although the weather was not always ideal and rainy Norwegian days were a regular part of the experience, the positive atmosphere and energy of the group transformed every activity into a valuable learning opportunity. Informal conversations and evening reflections were among the most meaningful moments of the entire project.

    Special thanks go to the facilitators, Berat and Tuba, who created a safe and welcoming environment throughout the week. They listened carefully to the needs of the group and adapted the programme flexibly to ensure a meaningful experience for all participants.

    Karolína returned from Norway not only with new knowledge and practical tools for youth work, but also with fresh inspiration, valuable international contacts, and renewed motivation to continue developing activities that support personal growth, wellbeing, and non-formal education for young people.

    *The project was financially supported by the Erasmus+ Programme through the Norwegian National Agency and implemented by Creative Connections Norway.*
