  perex: Naše třetí vlastní výměna mládeže, tentokrát o udržitelnosti, přírodě a ekologickém podnikání.
  report_author: Ondřej Stuchlík
  report: |
    Our trip started in Pardubice, where we first met as a Czech group, and then slowly started meeting the rest of the participants. Our facilitators picked us up there and we continued by bus into the countryside to reach the venue. The first teambuilding activity was totally unplanned, because it started raining heavily and we all spontaneously cooperated to get everything from the bus into our beautiful mountain lodge called “Radost”.

    The next day we realised that it wasn’t just a cottage in the middle of nowhere – it was also a farm, and we were surrounded by animals like horses. That’s the difference between solo travelling, where people usually visit bigger cities, and an Erasmus+ experience, where you can enjoy nature and still have some time to visit a city as well.

    It was the same during our project: we had a trip to Hradec Králové. We didn’t just visit the city but also went to a local “material bank” with a workshop where we could create something ourselves after the owner’s presentation. I was so excited about this opportunity that I immediately started searching if something similar exists in Brno.

    Speaking of manual skills, I also must mention our Czech/Slovak participant who decided to prepare “halušky” for the cultural evening. Even though cooking for such a huge group was really challenging, the result was highly appreciated, and we all enjoyed the whole preparation process too.

    As for the rest of the activities we did during our stay, I’d say the organisers found the perfect balance between more professional workshops with experts (like sustainable entrepreneurship) and more playful activities, such as creating an eco‑problem as a theatre performance, which was super fun, or making handy stuff from reused materials.

    Last but not least, I’m happy about the friendships I made there, and I’m 100% sure I’ll see some of the participants again.
