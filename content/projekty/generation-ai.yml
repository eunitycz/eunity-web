  perex: Tréninkový kurz o umělé inteligenci v každodenním životě i v práci s mládeží – ve skautském táboře u Atén.
  report: |
    From September 5 to 15, 2025, three participants from the Czech Republic joined the Erasmus+ Training Course “Generation AI” in Athens, Greece. The project brought together participants from ten European countries with a wide range of backgrounds and experiences, creating a truly diverse and stimulating environment.

    We were hosted in a scout camp near Athens, which offered a unique atmosphere of harmony with nature and its rules. Living in such conditions fostered a sense of cooperation, adaptability and respect for simplicity, values strongly rooted in scouting. Although the temperatures were very high, the heat never stopped us from fully engaging in the program and enjoying the experience to the fullest.

    The training combined workshops, practical demonstrations and group discussions exploring artificial intelligence and its role in both everyday life and professional contexts. A highlight for me was experimenting with new AI applications while also engaging in meaningful debates on the opportunities and risks of AI. Listening to the diverse perspectives of participants from different cultural settings broadened my own understanding of the topic.

    Beyond the structured sessions, the setting itself contributed greatly to the experience. The food was excellent, the proximity of the sea provided both energy and relaxation, and the natural environment created the perfect balance between learning and rest. Culture nights enriched the program with moments of joy, dance, traditional meals and laughter, building connections that went beyond professional networking.

    I met many inspiring people whose paths I hope to cross again, whether in professional collaborations or personal encounters. The knowledge and reflections I gained are not limited to the ten days of the course; they continue to shape my daily life, my work with young people, and even conversations with colleagues and friends.

    “Generation AI” proved to be a valuable experience that combined professional development, intercultural learning and personal growth. It strengthened my motivation to use AI responsibly and creatively, while also reminding me of the importance of community, curiosity and open exchange.
