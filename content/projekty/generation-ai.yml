  application_url: ''
  description: ''
  report: |-
    Od 5. do 15. září 2025 se tři účastníci z České republiky zapojili do tréninkového kurzu Erasmus+ „Generation AI“ v Aténách v Řecku. Projekt spojil účastníky z deseti evropských zemí s velmi rozmanitým zázemím a zkušenostmi, což vytvořilo opravdu pestré a podnětné prostředí.

    Ubytovaní jsme byli ve skautském táboře nedaleko Atén, který nabízel jedinečnou atmosféru souladu s přírodou a jejími pravidly. Život v takových podmínkách posiloval spolupráci, přizpůsobivost a respekt k jednoduchosti – hodnoty pevně zakořeněné ve skautingu. Přestože byla velká vedra, horko nám nezabránilo naplno se zapojit do programu a užít si celou zkušenost.

    Trénink kombinoval workshopy, praktické ukázky a skupinové diskuse o umělé inteligenci a její roli v každodenním životě i v profesním prostředí. Nejvíc mě bavilo zkoušet nové aplikace s umělou inteligencí a zároveň vést smysluplné debaty o jejích příležitostech a rizicích. Poslouchat různé pohledy účastníků z odlišných kulturních prostředí mi rozšířilo vlastní porozumění tématu.

    Kromě strukturovaného programu ke zkušenosti výrazně přispělo i samotné místo. Jídlo bylo výborné, blízkost moře dodávala energii i odpočinek a přírodní prostředí vytvářelo dokonalou rovnováhu mezi učením a relaxací. Kulturní večery obohatily program o chvíle radosti, tance, tradičních jídel a smíchu a pomohly navázat vztahy, které přesahovaly čistě profesní networking.

    Potkala jsem spoustu inspirativních lidí, se kterými se snad ještě setkám, ať už při profesní spolupráci, nebo osobně. Znalosti a postřehy, které jsem získala, se neomezují jen na deset dní kurzu – dál ovlivňují můj každodenní život, mou práci s mladými lidmi i rozhovory s kolegy a přáteli.

    „Generation AI“ se ukázal jako cenná zkušenost, která spojila profesní rozvoj, mezikulturní učení a osobní růst. Posílil mou motivaci používat umělou inteligenci zodpovědně a kreativně a zároveň mi připomněl, jak důležitá je komunita, zvědavost a otevřené sdílení.
