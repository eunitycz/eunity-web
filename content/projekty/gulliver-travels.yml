  title: Gulliver Travels
  type: vyslani
  format: trenink
  start: 2024-05-05
  end: 2024-05-12
  place: San Javier
  country: ES
  perex: Tréninkový kurz o rovnováze těla, duše a mysli – mindfulness, muzikoterapie, arteterapie a terapeutické divadlo.
  report: |
    After a long journey from the Czech Republic, we finally arrived in San Javier, Spain. The sun was shining, and the warm sea breeze made us feel welcome. At the meeting point, the facilitators greeted us and gave us important information about the project.

    The Erasmus+ training course “Gulliver’s Travel” brought together 24 people from eight European countries. The goal was to learn how to balance body, soul, and mind using different techniques. When we arrived, some participants were already talking and getting to know each other. We quickly joined them and started making new friends.

    The next day, we started with mindfulness exercises, music therapy, and art therapy. These activities helped us understand our emotions better. One of the most interesting parts was therapeutic theatre, where we had to step out of our comfort zones and express ourselves. In the afternoon, we did sports and leisure activities, which showed us how movement helps our well-being.

    Outside the official program, we had the chance to enjoy the local culture. There was a big festival happening in San Javier, and we got to see traditional performances and celebrations. One of the best moments was a flamenco night, where we experienced the passion of Spanish music and dance.

    Another great moment was the intercultural lunch. Each team shared their traditional food, and we proudly introduced Czech culture. These small moments brought us closer together and helped us learn about different cultures.

    During our siesta breaks, we didn’t just rest – we used the time to learn from each other. We practised new languages, shared stories, and even played musical instruments with our French friends. Every moment was a chance to grow and connect.

    As the training ended, we looked back at everything we had learned. This experience was not only about learning new methods – it was also about personal growth and making lifelong friendships. On the last day, we said emotional goodbyes, knowing this project had changed us in many ways.

    A big thank you to the Albores Association and everyone who made this possible. As one participant said, “Erasmus is connection,” and we truly felt that. We left San Javier not just with new knowledge but with amazing memories and friendships that will stay with us forever.
en:
  title: Gulliver Travels
  place: San Javier
  perex: A training course on balancing body, soul and mind – mindfulness, music therapy, art therapy and therapeutic theatre.
