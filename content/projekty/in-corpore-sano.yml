  title: In Corpore Sano
  type: vyslani
  format: vymena
  start: 2026-05-06
  end: 2026-05-12
  place: Fuente de Piedra
  country: ES
  perex: Výměna mládeže o zdravém životním stylu, wellbeingu a týmové práci v Andalusii.
  report: |
    Our Czech team took part in the youth exchange project In Corpore Sano, which took place in Fuente de Piedra, Spain, from 6th to 12th May 2026. The project brought together young people from different European countries to explore healthy lifestyles, wellbeing and teamwork through non-formal education and intercultural exchange.

    The first days were focused on icebreaker activities, which helped us meet many interesting people and create new connections. We also explored Fuente de Piedra, although the beginning of the programme felt rather unorganised. However, the intercultural night was a great experience, as we had the chance to taste traditional food from participating countries and learn more about their cultures.

    The third and fourth days brought workshops organised by participant groups. These sessions were very well prepared and finally gave us the opportunity to take part in sports and active team activities. They helped everyone bond more closely and created a much better atmosphere within the group. The meals prepared by the groups were also a big highlight of the project.

    We also enjoyed several thematic nights, where we learned more about different countries, including France and Hungary, and our Czech team had the opportunity to present our own traditions and culture.

    One of the biggest highlights of the exchange was the free day, when our Czech team rented a car and travelled to Granada. This trip brought us even closer together and created some of our best memories. Another unforgettable experience was our visit to Antequera, which many of us considered one of the most beautiful cities in Andalusia.

    The final day was dedicated to saying goodbye and travelling home. Although the project faced some organisational challenges and there was no final evaluation during the project, it was still a valuable experience.

    This exchange taught us a lot about healthy lifestyles, teamwork and adaptability. Most importantly, it gave us the opportunity to discover new cultures, create strong friendships and make unforgettable memories together.
en:
