cs:
  title: Disconnect to Connect
  type: nas
  format: vymena
  start: 2025-05-02
  end: 2025-05-09
  place: Červená Voda
  country: CZ
  perex: Naše historicky první výměna mládeže. 32 účastníků z pěti zemí řešilo závislost na sociálních sítích a její dopady na každodenní život.
  report: |
    Uspořádali jsme historicky první mezinárodní výměnu mládeže pod hlavičkou naší organizace. Tématem projektu byla závislost na sociálních sítích a její dopady na každodenní život mladých lidí – téma, které považujeme za mimořádně aktuální a důležité.

    ## Přípravy a mezinárodní spolupráce

    Na přípravách projektu jsme pracovali více než rok a úzce jsme spolupracovali s partnery z partnerských zemí, kterým tímto patří velké poděkování za spolupráci, podporu a profesionalitu.

    Výměna se konala na krásné wellness chatě v Červené Vodě, kde měli účastníci ideální zázemí nejen pro práci během nabitých workshopů, ale i pro odpočinek.

    Celkem jsme hostili 32 účastníků z pěti zemí – kromě České republiky se projektu zúčastnili mladí lidé ze Španělska, Slovinska, Rumunska a Turecka. Právě mezinárodní rozměr a možnost vzájemného poznávání považujeme za jednu z největších přidaných hodnot výměn mládeže.

    ## Program plný inspirace

    Během pěti intenzivních dní jsme se s účastníky věnovali tématu sociálních sítí z různých úhlů pohledu. Diskutovali jsme o dopadech digitálního prostředí na psychiku, zkoušeli praktické metody, jak se závislostí pracovat, a hledali alternativní způsoby trávení volného času. Součástí programu byla i „očistná procházka“, kterou doprovázela řízená meditace a cvičení mindfulness.

    Jeden den programu naše pozvání přijala certifikovaná lektorka jógy Soňa Svobodová, která účastníky učila techniky vědomého dýchání a jeho využití v jógových pozicích – dovednost, která může být účinným nástrojem při zvládání úzkosti. Dalším hostem byl MSc. Oldřich Šubrt, který přiblížil téma závislosti z psychologicko-biologického hlediska a pomohl účastníkům pochopit, jak závislost vzniká a jak působí na mozek.

    Cílem projektu bylo přimět mladé lidi k sebereflexi – tedy k zamyšlení nad tím, jak sociální sítě ovlivňují jejich každodenní život a jak s nimi mohou zacházet vědoměji.

    ## Udržitelnost a společná odpovědnost

    Naší prioritou bylo také udržitelné fungování projektu. Celý týden nám k dobré náladě přispívala skvělá jídla šéfkuchaře Daniela, díky čemuž jsme minimalizovali odpad a neplýtvali potravinami. Jsme hrdí na to, že jsme během celého pobytu nemuseli vyhazovat téměř žádné jídlo – což plně odpovídá našemu dlouhodobému cíli chovat se ekologicky a zodpovědně.

    ## Sdílení výsledků a dopad

    Po skončení výměny účastníci připravili prezentační aktivity ve svých komunitách, kde sdíleli výsledky projektu i své osobní zkušenosti. Díky tomu měl projekt dopad i mimo samotné místo konání a inspiroval další mladé lidi k zamyšlení nad jejich digitálními návyky.

    ## Poděkování

    Tento projekt by se neuskutečnil bez podpory programu Erasmus+, který umožňuje neformální vzdělávání mladých lidí po celé Evropě. Rádi bychom jménem celé organizace poděkovali:

    - Mgr. Soně Svobodové za inspirativní lekce jógy,
    - MSc. Oldřichu Šubrtovi za odborný přínos,
    - Komunitnímu centru Červená Voda a ZŠ Červená Voda za poskytnutí prostor,
    - a v neposlední řadě našim partnerům za úzkou spolupráci a spolehlivost.

    Děkujeme všem účastníkům, expertům i podporovatelům, díky nimž se náš první Erasmus+ projekt stal nezapomenutelným zážitkem. Těšíme se, že na tento úspěch v budoucnu navážeme!
en:
  title: Disconnect to Connect
  place: Červená Voda
  perex: Our very first youth exchange. 32 participants from five countries explored social media addiction and its impact on everyday life.
  report: |
    **All roads lead to Czechia.**

    After many projects abroad, we finally had one on our “home turf.” This time, the project took place in Červená Voda. Thanks to the short travel distance compared to other countries, we were among the first participants to arrive at the accommodation. I must say, I was genuinely surprised by the quality of the place — I knew right away that this would be the perfect base for our project.

    As time went on, more and more participants began to arrive, and we slowly started to get to know each other. Personally, I met a lot of people who had a similar vibe, so it’s no surprise that we stayed up talking till late at night.

    On the first day of the project, we played several icebreakers such as “Mission Impossible,” which really brought the team together. In total, there were around 30 people from 5 different countries.

    Soon, we dove into the workshops, and I really appreciated that many of them were led by professionals, such as the yoga class or our lecturer Olda, who gave us a fascinating talk about social media addiction from a psychological perspective. Thanks to him, we were able to do some inner self-evaluation.

    Of course, there were also activities we organised ourselves, like creating videos connected to the project topic. That’s where I discovered I might have a hidden talent for movie production!

    We also went hiking and meditated in the beautiful Czech mountains, which was amazing. Some of our brave (and slightly crazy) participants even went swimming in a lake full of frogs!

    Day by day, we built strong connections with each other, and soon we realised that the project was coming to an end. Even though I’ve been on several projects before, it was still hard to leave. But I know I learned something about myself, made a few truly good friends, and we’ll see each other again soon.

    Thank you all for being part of this journey and for everything we experienced together!
