  country: CZ
  perex: Druhá výměna mládeže pořádaná EUnity. 42 účastníků ze 7 zemí zkoumalo, jak pohyb pomáhá duševnímu zdraví.
  report: |
    Ve zdravém těle zdravý duch! I takto by se dala shrnout druhá výměna mládeže pořádaná naší malou organizací. Do mezinárodního projektu Mind in Motion se zapojilo 7 neziskových a mládežnických organizací, které zajistily nezapomenutelný týden 42 účastníkům.

    ## Přípravy a mezinárodní spolupráce

    Příprava projektu trvala téměř celý rok: předprojektová online setkání, logistické výzvy, ale i koordinace veškerých venkovních aktivit. Naštěstí jsme vedle sebe měli opět kvalitní partnery na všech frontách, kteří nám pomohli k hladkému průběhu nejen příprav, ale také samotné výměny.

    ## Pohybem ke zdravé mysli

    Za šest intenzivních dní bylo naším cílem přiblížit účastníkům význam pohybu v našem životě, a to nejen po fyzické stránce, ale především po té mentální. Diskutovali jsme o možnostech a výzvách aktivního životního stylu ve všech 7 zemích. Jako zpestření jsme účastníky vzali na výlet do lanového centra, pro některé z nich to byla vůbec první návštěva. Díky této aktivitě jsme jim ukázali, jak je pro psychické zdraví přínosné překonávání překážek. Pro některé účastníky to byla opravdová výzva.

    Dále jsme účastníkům představili přínos jógy a dechových cvičení pro celkovou duševní pohodu a také způsoby, jak vhodně regenerovat.

    ## Sdílení výsledků a dopad

    Po skončení výměny účastníci připravili příspěvky na sociální sítě, kde sdíleli výsledky projektu i své osobní zkušenosti. Každý národní tým navíc připravil prezentaci pro své přátele, spolužáky a další mladé lidi, kde sdílel svou vlastní Erasmus+ zkušenost. Díky tomu měl projekt dopad i mimo samotné místo konání a mohl inspirovat dál.

    ## Poděkování

    Tento projekt by se neuskutečnil bez podpory programu Erasmus+, který umožňuje neformální vzdělávání mladých lidí po celé Evropě.
en:
  title: Mind in Motion
  place: Sudislav nad Orlicí
  perex: The second youth exchange organised by EUnity. 42 participants from 7 countries explored how movement supports mental health.
  report: |
    A healthy mind in a healthy body! That is one way to sum up the second youth exchange organised by our small organisation. Seven non-profit and youth organisations took part in the international project Mind in Motion and together gave 42 participants an unforgettable week.

    ## Preparation and international cooperation

    Preparing the project took almost a whole year: online meetings before the project, logistical challenges and the coordination of all the outdoor activities. Fortunately, we once again had great partners on every front, who helped make both the preparations and the exchange itself run smoothly.

    ## Moving towards a healthy mind

    Over six intensive days, our aim was to show participants how important movement is in our lives – not only physically, but above all mentally. We discussed the opportunities and challenges of an active lifestyle in all seven countries. For a change of pace, we took the participants to a rope park, which was a first for some of them. Through this activity we showed them how overcoming obstacles benefits mental health. For some participants it was a real challenge.

    We also introduced participants to the benefits of yoga and breathing exercises for overall wellbeing, and to good ways of recovering.

    ## Sharing results and impact

    After the exchange, participants prepared social media posts sharing the project’s results and their personal experiences. Each national team also prepared a presentation for their friends, classmates and other young people, sharing their own Erasmus+ experience. This way, the project had an impact beyond the venue itself and could inspire others.

    ## Thank you

    This project would not have been possible without the support of the Erasmus+ programme, which makes non-formal education possible for young people all over Europe.
