cs:
  title: Hidden Figures
  type: vyslani
  format: vymena
  start: 2024-05-05
  end: 2024-05-12
  place: Valdepeñas
  country: ES
  perex: Výměna mládeže o genderové rovnosti, mediální gramotnosti a fake news – mladí lidé ze šesti zemí.
  report: |
    Po přímém letu z Prahy jsme se všichni čeští účastníci sešli na letišti v Madridu, kde nás přivítali milí facilitátoři. Následovala téměř tříhodinová cesta autobusem španělským venkovem – trochu chaotická, ale plná vzrušení a očekávání. I když jsme mířili tak trochu doprostřed ničeho, dorazili jsme plní zvědavosti a s otevřenou myslí.

    Tato výměna mládeže Erasmus+ spojila mladé lidi ze šesti zemí: České republiky, Španělska, Arménie, Gruzie, Srbska a Turecka. Hlavními tématy projektu byly genderová rovnost, mediální gramotnost, fake news a mezikulturní porozumění.

    První dny byly nabité seznamovacími aktivitami, teambuildingovými hrami a kreativními skupinovými výzvami. Jednou z nejzábavnějších byla „Mission Impossible“ – rychlý závod s časem, ve kterém jsme plnili vtipné a nápadité úkoly. Byla to fuška, ale rychle jsme se naučili jména ostatních a začali si budovat silné vztahy.

    Workshopy se věnovaly důležitým tématům, jako jsou genderové stereotypy, vliv sociálních sítí a šíření dezinformací. Vrcholem byla návštěva historického Toleda, kde jsme dělali rozhovory s místními o genderové rovnosti a podle jejich odpovědí natočili krátká videa.

    K vrcholům týdne patřily i mezikulturní večery. Každá země představila své tradice skrze jídlo, hudbu a tanec, a vznikly tak nezapomenutelné chvíle radosti, učení a opravdové kulturní výměny.

    Navzdory několika organizačním zádrhelům nám výměna přinesla nové pohledy, cenné poznatky a vzpomínky na celý život. I když jsme se ne vždy drželi harmonogramu, drželi jsme se při sobě – a to bylo to nejdůležitější.

    Děkujeme organizačnímu týmu a všem účastníkům, díky kterým byl tento týden tak výjimečný: vzdálený, intenzivní, upřímný – a opravdu nezapomenutelný.
en:
  title: Hidden Figures
  place: Valdepeñas
  perex: A youth exchange on gender equality, media literacy and fake news – young people from six countries.
  report: |
    After a direct flight from Prague, all Czech participants met at the Madrid airport, where our friendly facilitators welcomed us. What followed was a nearly three-hour bus journey through the Spanish countryside – a bit chaotic, but filled with excitement and anticipation. Despite heading to what felt like the middle of nowhere, we arrived full of curiosity and open minds.

    This Erasmus+ youth exchange brought together young people from six countries: the Czech Republic, Spain, Armenia, Georgia, Serbia, and Turkey. The main themes of the project were gender equality, media literacy, fake news, and intercultural understanding.

    The first days were packed with ice-breakers, team-building games, and creative group challenges. One of the most exciting was “Mission Impossible” – a fast-paced race against time to complete fun and imaginative tasks. It was tiring, but it helped us quickly learn each other’s names and start building strong connections.

    The workshops explored important topics such as gender stereotypes, the influence of social media, and the spread of misinformation. A highlight was our visit to the historic city of Toledo, where we interviewed locals about gender equality and created short videos based on their responses.

    One of the highlights of the week were the intercultural evenings. Each country shared its traditions through food, music, and dance, creating unforgettable moments of joy, learning, and genuine cultural exchange.

    Despite some organisational hiccups, the exchange offered us new perspectives, valuable insights, and memories to last a lifetime. Even if we didn’t always stick to the schedule, we stuck together – and that made all the difference.

    Thank you to the organising team and all the participants who made this week so special: remote, intense, honest – and truly unforgettable.
