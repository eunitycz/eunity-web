  perex: Výměna mládeže o genderové rovnosti, mediální gramotnosti a fake news – mladí lidé ze šesti zemí.
  report: |
    After a direct flight from Prague, all Czech participants met at the Madrid airport, where our friendly facilitators welcomed us. What followed was a nearly three-hour bus journey through the Spanish countryside – a bit chaotic, but filled with excitement and anticipation. Despite heading to what felt like the middle of nowhere, we arrived full of curiosity and open minds.

    This Erasmus+ youth exchange brought together young people from six countries: the Czech Republic, Spain, Armenia, Georgia, Serbia, and Turkey. The main themes of the project were gender equality, media literacy, fake news, and intercultural understanding.

    The first days were packed with ice-breakers, team-building games, and creative group challenges. One of the most exciting was “Mission Impossible” – a fast-paced race against time to complete fun and imaginative tasks. It was tiring, but it helped us quickly learn each other’s names and start building strong connections.

    The workshops explored important topics such as gender stereotypes, the influence of social media, and the spread of misinformation. A highlight was our visit to the historic city of Toledo, where we interviewed locals about gender equality and created short videos based on their responses.

    One of the highlights of the week were the intercultural evenings. Each country shared its traditions through food, music, and dance, creating unforgettable moments of joy, learning, and genuine cultural exchange.

    Despite some organisational hiccups, the exchange offered us new perspectives, valuable insights, and memories to last a lifetime. Even if we didn’t always stick to the schedule, we stuck together – and that made all the difference.

    Thank you to the organising team and all the participants who made this week so special: remote, intense, honest – and truly unforgettable.
